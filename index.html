<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d1677">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Superviseur">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="icon" href="icons/icon-192.png">
<title>Superviseur</title>
<style>
:root{--bg:#f3f5f9;--card:#ffffff;--card2:#f7f9fc;--ink:#14163a;--mute:#5f6587;--line:#dde2ec;--acc:#00927c;--accInk:#ffffff;--red:#d3343e;--amber:#b7770d;--ok:#16895c;--soft:#e2f4f0;--navy:#1d1677;--navyInk:#ffffff;--iconbg:#eef0fb;
--mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;--r:14px;--sh:0 1px 2px rgba(20,22,58,.06),0 4px 14px rgba(20,22,58,.05)}
body.dark{--bg:#0c0b24;--card:#16153b;--card2:#1c1b47;--ink:#eceeff;--mute:#9a9cc3;--line:#2b2a5c;--acc:#2fd0b4;--accInk:#032a22;--soft:#173a45;--red:#e5484d;--amber:#f2b33d;--ok:#3ccf8e;--navy:#3b33c4;--navyInk:#ffffff;--iconbg:#24235a;--sh:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.app{display:flex;min-height:100vh}
nav.side{display:none}
main{flex:1;min-width:0;padding:0 0 88px}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:max(10px,env(safe-area-inset-top)) 16px 10px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;border-bottom:1px solid var(--line)}
.brand{font-weight:700;font-size:15px;flex:1;letter-spacing:.2px}
.brand .mono{color:var(--acc);margin-left:8px;font-weight:600}
.search{order:3;flex-basis:100%;position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:11px 14px 11px 38px;outline:none}
.search input:focus{border-color:var(--acc)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.6}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:10px;height:38px;padding:0 11px;display:grid;place-items:center;cursor:pointer;font-size:13px;font-weight:600}
.sync{display:none!important;font-size:11px;font-weight:700;color:var(--mute);white-space:nowrap}.sync.ok{color:var(--ok)}.sync.err{color:var(--amber)}
.wrap{padding:14px 16px 16px;max-width:1180px;margin:0 auto}
h1{font-size:22px;margin:4px 0 2px;letter-spacing:-.3px}
h2{font-size:11px;text-transform:uppercase;letter-spacing:1.4px;color:var(--mute);margin:22px 0 8px;font-weight:700}
.sub{color:var(--mute);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--sh)}
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:none}
.row .num{font-weight:700;min-width:42px;font-size:13px;font-family:var(--mono);color:var(--acc)}
.row .t{flex:1;min-width:0}.row .t b{display:block;font-weight:600}.row .t small{color:var(--mute);font-size:12px;display:block}
.grid{display:grid;gap:8px;grid-template-columns:repeat(2,minmax(0,1fr))}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:3px;text-align:left;min-height:74px}
.tile:active{transform:scale(.98)}
.tile b{font-size:14px}.tile span{font-size:12px;color:var(--mute)}
.tile .k{font-family:var(--mono);font-size:12px;color:var(--acc)}
.incbtn{display:block;width:100%;border:none;background:var(--red);color:#fff;border-radius:14px;padding:18px 14px;cursor:pointer;text-align:center}
.incbtn b{display:block;font-size:19px;letter-spacing:.2px}.incbtn span{font-size:13px;color:#ffd6d8}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;cursor:pointer}
.stat .v{font-family:var(--mono);font-size:22px;font-weight:600;color:var(--acc);line-height:1.2}
.stat .l{font-size:12px;color:var(--mute)}
.stat.warn .v{color:var(--amber)}.stat.red .v{color:#ff6b72}
.clock{font-family:var(--mono);font-size:30px;font-weight:600;color:var(--acc);letter-spacing:-.5px}
.live .e{border-left:2px solid var(--line);padding:6px 0 6px 10px;margin-left:2px}
.live .e:first-child{border-left-color:var(--acc)}
.live .h{font-family:var(--mono);color:var(--acc);margin-right:8px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 11px;font-size:13px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--accInk);font-weight:700}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;margin-bottom:12px;overflow-x:auto}
.seg button{flex:1;border:none;background:none;padding:8px 10px;border-radius:8px;font-weight:700;font-size:13px;color:var(--mute);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--soft);color:var(--acc)}
.btn{border:none;background:var(--acc);color:var(--accInk);border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}
.btn.ghost{background:var(--soft);color:var(--acc)}
.btn.red{background:var(--red);color:#fff}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.tel{display:inline-flex;align-items:center;gap:6px;font-weight:600;text-decoration:none;background:var(--soft);color:var(--acc);padding:5px 10px;border-radius:8px;margin:3px 6px 3px 0;font-family:var(--mono);white-space:nowrap}
.tel.fax{background:transparent;color:var(--mute)}
.ind{display:inline-block;font-family:var(--mono);font-weight:700;background:var(--soft);color:var(--acc);padding:4px 9px;border-radius:8px;margin-top:4px}
input.f,select.f,textarea.f{width:100%;border:1px solid var(--line);background:var(--card2);border-radius:10px;padding:10px 12px;outline:none}
input.f:focus,textarea.f:focus{border-color:var(--acc)}
textarea.f{min-height:80px;resize:vertical}
label.l{font-size:11px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:1px;display:block;margin:12px 0 5px}
.tpl{line-height:2.15;font-size:15px}
.tpl input{border:none;border-bottom:2px solid var(--amber);background:rgba(242,179,61,.16);border-radius:6px 6px 0 0;padding:2px 6px;min-width:60px;color:var(--ink)}
.out{white-space:pre-wrap;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:14px;margin-top:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}.kv b{white-space:nowrap;color:var(--mute);font-weight:600}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--soft);color:var(--acc);font-family:var(--mono)}
.tag{display:inline-block;font-size:10px;font-weight:800;padding:2px 6px;border-radius:5px;color:#fff;letter-spacing:.4px}
.empty{color:var(--mute);padding:16px;text-align:center}
.steps{display:flex;gap:6px;overflow-x:auto;margin:12px 0;scrollbar-width:none}
.steps button{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px;text-align:left;cursor:pointer;color:var(--mute);font-size:12px}
.steps button b{display:block;font-family:var(--mono);font-size:13px}
.steps button.on{border-color:var(--acc);color:var(--ink)}.steps button.on b{color:var(--acc)}
.steps button.done b{color:var(--ok)}
.navsteps{display:flex;gap:8px;margin-top:16px}
.navsteps .btn{flex:1}
.inchead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.timer{font-family:var(--mono);font-size:22px;color:var(--amber);font-weight:600}
.lg img{width:100%;border-radius:8px;background:#fff;display:block;cursor:zoom-in}
.log{display:flex;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.log:last-child{border-bottom:none}
.log .h{font-family:var(--mono);color:var(--acc);min-width:46px}
.log .x{flex:1;white-space:pre-wrap}
.log button{background:none;border:none;color:var(--mute);cursor:pointer}
.ck{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.ck input{width:20px;height:20px;margin-top:1px;accent-color:var(--ok);flex:none}
.ck.done span{color:var(--mute);text-decoration:line-through}
table.tb{width:100%;border-collapse:collapse;font-size:14px}
table.tb td,table.tb th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.tb th{font-size:11px;text-transform:uppercase;color:var(--mute);letter-spacing:.8px}
table.tb td.m{font-family:var(--mono);color:var(--acc);font-weight:600}
.hl{background:rgba(242,179,61,.35);border-radius:3px}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);background:var(--acc);color:var(--accInk);padding:10px 16px;border-radius:10px;font-weight:700;opacity:0;transition:.2s;z-index:100;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
nav.bot{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px max(8px,env(safe-area-inset-bottom));z-index:30}
nav.bot button,nav.side button{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--mute);cursor:pointer;padding:4px 10px;border-radius:10px;font-weight:600}
nav.bot button.on,nav.side button.on{color:var(--acc)}
nav svg{width:23px;height:23px}
.viewer{position:fixed;inset:0;background:#05070f;z-index:60;display:none;flex-direction:column}
.viewer.on{display:flex}
.vbar{display:flex;align-items:center;gap:8px;padding:max(10px,env(safe-area-inset-top)) 12px 10px;color:#fff}
.vbar .vt{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vbar button{background:rgba(255,255,255,.12);border:none;color:#fff;border-radius:10px;height:38px;min-width:38px;padding:0 10px;cursor:pointer;font-weight:700}
.vbody{flex:1;overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:0 8px 12px}
.vbody img{width:100%;max-width:900px;height:auto;border-radius:6px;background:#fff}
.vbody.zoom img{width:220%;max-width:none}
.foot{color:var(--mute);font-size:11px;text-align:center;margin:28px 0 8px}
.confirm{background:var(--red)!important;color:#fff!important}
.hhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:2px 0 12px}
.big4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.big{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:16px 14px;min-height:150px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;color:var(--ink)}
.big:active{transform:scale(.98)}
.big svg{width:30px;height:30px;margin-bottom:auto;color:var(--c)}
.big b{font-size:19px;line-height:1.2}.big span{font-size:12.5px;color:var(--mute);line-height:1.35}
.big.b1{--c:#fff;background:var(--red);border-color:var(--red);color:#fff}.big.b1 span{color:#ffe0e2}
.big.b2{--c:var(--acc)}.big.b3{--c:#9b8cf0}.big.b4{--c:var(--amber)}
.big.b3.live{border-color:#9b8cf0;background:linear-gradient(160deg,rgba(155,140,240,.25),var(--card) 70%)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--red);flex:none;box-shadow:0 0 0 4px rgba(229,72,77,.2)}
.discreet{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:18px}
.discreet button{background:none;border:none;padding:4px 0;color:var(--mute);font-size:13px;cursor:pointer}
.discreet button b{color:var(--acc);font-family:var(--mono)}
.side-pick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.closebox{border-color:var(--red);margin-top:12px}
@media(min-width:900px){.big4{grid-template-columns:repeat(4,minmax(0,1fr))}.big{min-height:180px}}
.acts{display:grid;gap:8px;grid-template-columns:repeat(2,minmax(0,1fr))}
.act{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-height:84px}
.act:active,.fam:active{transform:scale(.985)}
.act b{font-size:16px;line-height:1.25}.act span{font-size:12.5px;color:var(--mute)}
.act .ic{font-family:var(--mono);font-weight:700;font-size:11px;letter-spacing:.8px;color:var(--acc)}
.act.main{grid-column:1/-1;background:var(--red);border-color:var(--red);color:#fff;min-height:96px}.act.main span{color:#ffd6d8}.act.main .ic{color:#fff;opacity:.85}.act.main b{font-size:20px}
.act.pcev{border-left:5px solid #9b8cf0}.act.pcev .ic{color:#9b8cf0}
.act.pcev.live{background:linear-gradient(135deg,rgba(155,140,240,.22),transparent 70%);border-color:#9b8cf0}
.act.crise{border-left:5px solid var(--red)}.act.crise .ic{color:#ff6b72}
.fams{display:grid;gap:8px;margin-top:12px}
.fam{border:1px solid var(--line);border-left:6px solid var(--c);background:var(--card);border-radius:14px;padding:14px 14px 13px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.fam .fh{display:flex;justify-content:space-between;align-items:center}.fam .fh b{font-size:17px}.fam .fh .mono{color:var(--c);font-weight:700}
.fam>span{font-size:12.5px;color:var(--mute)}
.crumb{display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-size:12.5px;color:var(--mute);margin:2px 0 8px}
.crumb button{background:none;border:none;color:var(--acc);padding:0;cursor:pointer;font-size:12.5px;font-weight:600;text-align:left}
.trig{margin-bottom:10px}.trig b{font-size:14px}
.stp{display:flex;gap:10px;margin-bottom:8px;scroll-margin:120px}
.stp .n{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-weight:700;background:var(--soft);color:var(--acc);font-size:13px;margin-top:7px}
.stp .c{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;transition:box-shadow .3s}
.stp.q .c{background:var(--card2);border-color:#4b5bb8}.stp.q .n{background:#4b5bb8;color:#fff}
.stp.ok .c{border-color:var(--ok)}.stp.ok .n{background:var(--ok);color:#06281a}
.stp.end .n{background:var(--ink);color:var(--bg)}.stp.end .c{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stp.flash .c{box-shadow:0 0 0 3px var(--acc)}
.stp .tt{font-weight:600}.stp.q .tt{font-weight:800;letter-spacing:.2px;font-size:14px}
.stp .nt{font-size:13px;color:var(--mute);margin-top:3px}
.stp .dn{margin-top:8px}
.br{display:flex;gap:8px;align-items:flex-start;margin-top:8px;padding:8px;border-radius:10px;border:1px solid var(--line);cursor:pointer;background:var(--card)}
.br .k{font-size:11px;font-weight:800;padding:3px 8px;border-radius:6px;color:#fff;flex:none}
.br .k.OUI{background:#1f9a62}.br .k.NON{background:#d9363e}
.br .x{font-size:13px;flex:1;font-weight:600}
.br.on{border-color:var(--acc);background:var(--soft)}.br.off{opacity:.4}
.bdg{font-size:10px;font-weight:800;padding:2px 7px;border-radius:10px;background:#56608f;color:#fff;margin-left:8px;vertical-align:2px}
.out[data-prev]{font-size:13.5px}
@media(min-width:900px){.acts{grid-template-columns:repeat(3,minmax(0,1fr))}.act.main{grid-column:auto}.fams{grid-template-columns:repeat(2,minmax(0,1fr))}}
.brand .logo{display:inline-grid;place-items:center;background:var(--navy);color:#fff;border-radius:8px;font-size:11px;font-weight:800;letter-spacing:.5px;padding:4px 6px;margin-right:8px;border-bottom:3px solid var(--acc);vertical-align:1px}
header.top{background:var(--card)!important;box-shadow:var(--sh)}
nav.side .brand{line-height:1.5}
.big4 .big{box-shadow:var(--sh)}
.big .ic2{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--iconbg);margin-bottom:auto}
.big .ic2 svg{margin:0;width:26px;height:26px}
.big.b1{background:var(--navy);border-color:var(--navy);color:#fff}.big.b1 .ic2{background:rgba(255,255,255,.14)}.big.b1 svg{color:#fff}.big.b1 span{color:#d9dcff}
.big.b1::after{content:"";display:block;height:4px;border-radius:3px;background:var(--acc);margin-top:6px;width:44px}
.big.b2 svg{color:var(--acc)}.big.b3 svg{color:var(--navy)}body.dark .big.b3 svg{color:#9d97ff}.big.b4 svg{color:var(--acc)}
.minis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.mini{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer;text-align:left;box-shadow:var(--sh)}
.mini b{font-size:14px;display:block}.mini small{font-size:12px;color:var(--mute)}
.mini i{font-style:normal;font-family:var(--mono);font-weight:800;font-size:11px;color:var(--acc);background:var(--soft);border-radius:8px;padding:6px 7px;min-width:38px;text-align:center}
.fhead{margin:10px 0 12px}.fhead h1{margin:2px 0 6px}.pills{display:flex;flex-wrap:wrap;gap:6px}
.fgrid{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}.fs{min-width:0}.fs select.f{text-overflow:ellipsis}
.fs h3{display:flex;align-items:center;gap:10px;margin:0 0 10px;font-size:16px}
.fs h3 span{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--navy);color:#fff;font-size:13px;font-family:var(--mono);flex:none}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.modes{display:flex;flex-wrap:wrap;gap:6px}
.modes button{border:1px solid var(--line);background:var(--card2);border-radius:10px;padding:9px 12px;font-weight:700;font-size:14px;cursor:pointer;color:var(--ink)}
.modes button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.hint{font-size:12.5px;color:var(--mute);margin-top:8px;background:var(--card2);border-radius:8px;padding:7px 10px}
.hint.warn{color:var(--amber);background:rgba(242,179,61,.12);margin:0 0 8px}
ol.todo{margin:0;padding-left:22px}ol.todo li{padding:6px 0;border-bottom:1px dashed var(--line)}ol.todo li:last-child{border-bottom:none}
ol.todo small{display:block;color:var(--mute);font-size:12.5px}
.brs{display:flex;flex-direction:column;gap:3px;margin-top:4px;font-size:13.5px}
.brs i,.k{font-style:normal;font-size:10.5px;font-weight:800;padding:1px 6px;border-radius:5px;color:#fff;margin-right:4px}
.brs i.OUI{background:#16895c}.brs i.NON{background:#d3343e}
.keys{margin-top:10px;background:var(--soft);border-radius:10px;padding:8px 12px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.keys small{display:block;color:var(--mute);font-size:12px}
details{margin-top:8px;font-size:14px}details summary{cursor:pointer;color:var(--acc);font-weight:700;padding:4px 0}details ul,details ol{margin:4px 0;padding-left:20px}details li{margin:3px 0}
.lnk{background:none;border:none;color:var(--acc);font-weight:700;cursor:pointer;padding:8px 0 0;font-size:13.5px}

<script>/* Superviseur — déverrouillage et déchiffrement local (aucun envoi externe) */
(function(){
const B=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const E=b=>{let s='';const a=new Uint8Array(b);for(let i=0;i<a.length;i+=8192)s+=String.fromCharCode.apply(null,a.subarray(i,i+8192));return btoa(s)};
const enc=t=>new TextEncoder().encode(t);
const KEY='sv.dk';let DK=null,VAULT=null;const IMG={};
const ncode=c=>String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
async function tryCode(code){const base=await crypto.subtle.importKey('raw',enc(ncode(code)),'PBKDF2',false,['deriveKey']);
 for(const k of VAULT.keys){const kek=await crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:B(k.salt),iterations:VAULT.iter},base,{name:'AES-GCM',length:256},false,['decrypt']);
  try{return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:B(k.iv)},kek,B(k.wk)))}catch(e){}}
 return null}
async function openVault(raw){DK=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['encrypt','decrypt']);
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:B(VAULT.iv),additionalData:enc('superviseur')},DK,B(VAULT.ct));
 const p=JSON.parse(new TextDecoder().decode(pt));window.STATIC=p.static;window.APPDATA=p.app;window.SV_VER=VAULT.ver}
window._svImg=async p=>{if(IMG[p])return IMG[p];const r=await fetch('vault/p-'+String(p).padStart(3,'0')+'.bin?v='+encodeURIComponent(VAULT.ver));if(!r.ok)throw new Error('img');
 const b=new Uint8Array(await r.arrayBuffer());const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(0,12),additionalData:enc('img')},DK,b.slice(12));
 return IMG[p]=URL.createObjectURL(new Blob([pt],{type:'image/webp'}))};
window.svDownload=(name,data,type)=>{const u=URL.createObjectURL(new Blob([data],{type:type||'application/octet-stream'}));const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},4000)};
window.__svEnc=async(pt,ad)=>{const iv=crypto.getRandomValues(new Uint8Array(12));const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv,additionalData:enc(ad)},DK,pt));return {iv,ct}};
window.__svDec=async(ct,iv,ad)=>new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv,additionalData:enc(ad)},DK,ct));
window.svLock=()=>{try{localStorage.removeItem(KEY);localStorage.removeItem('sv.sync');localStorage.removeItem('sv.base')}catch(e){}location.reload()};
async function warm(){try{for(let i=1;i<=(VAULT.imgs||100);i++){await fetch('vault/p-'+String(i).padStart(3,'0')+'.bin?v='+encodeURIComponent(VAULT.ver)).catch(()=>{})}}catch(e){}}
const $=id=>document.getElementById(id);
function show(msg){$('lock').classList.add('on');if(msg)$('lockmsg').textContent=msg}
function ready(){$('lock').classList.remove('on');window.__svStart();setTimeout(warm,1500)}
async function boot(){
 if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
 try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}catch(e){}
 if(!window.crypto||!crypto.subtle){show('Navigateur non compatible (connexion sécurisée HTTPS requise).');return}
 try{VAULT=await (await fetch('vault/vault.json',{cache:'no-cache'})).json()}catch(e){show('Pas de connexion et appli pas encore installée sur cet appareil.');return}
 const saved=(()=>{try{return localStorage.getItem(KEY)}catch(e){return null}})();
 if(saved){try{await openVault(B(saved));ready();return}catch(e){try{localStorage.removeItem(KEY)}catch(_){}show('Accès expiré ou code retiré : saisis un code valide.')}}
 else show();
 const go=async()=>{const c=$('lockcode').value;$('lockerr').textContent='';if(ncode(c).length<8){$('lockerr').textContent='Code incomplet.';return}
  $('lockgo').disabled=true;$('lockgo').textContent='Vérification…';
  try{const raw=await tryCode(c);if(!raw){$('lockerr').textContent='Code incorrect.';return}
   try{localStorage.setItem(KEY,E(raw))}catch(e){}await openVault(raw);$('lockcode').value='';ready()}
  catch(e){$('lockerr').textContent='Erreur de déchiffrement.'}
  finally{$('lockgo').disabled=false;$('lockgo').textContent='Déverrouiller'}};
 $('lockgo').onclick=go;$('lockcode').onkeydown=e=>{if(e.key==='Enter')go()};
}
document.addEventListener('DOMContentLoaded',boot);
})();
</script>
<script>
window.__svStart=()=>start();
function start(){
const D=window.APPDATA, S=window.STATIC, PAGES=D.pages;
const $=s=>document.querySelector(s), view=$('#view');
const MEM={};
const lget=(k,d)=>{try{const v=localStorage.getItem('pcs.'+k);if(v!==null)return JSON.parse(v)}catch(e){}return k in MEM?MEM[k]:d};
const lset=(k,v)=>{MEM[k]=v;try{localStorage.setItem('pcs.'+k,JSON.stringify(v))}catch(e){try{const t=document.getElementById('toast');t.textContent='⚠ Stockage plein : exporte (Réglages) puis vide le journal';t.classList.add('on');setTimeout(()=>t.classList.remove('on'),6000)}catch(_){}}};
const SK=['favs','vac','tclLvl','annCat','ck','log','lastPage','inc','pce'];
const store={get:lget,set(k,v){lset(k,v);if(window.__svChanged&&['inc','log','pce','ck','favs','vac','tclLvl','name'].includes(k))window.__svChanged();if(SK.includes(k)){stamp=Math.max(Date.now(),seen+1);schedulePush()}}};
let remote=null,pushT=null,writing=false,dirty=false,pending=false,stamp=0,seen=0;const pushed=new Set();
function setSync(s){const e=$('#sync');if(!e)return;e.textContent=s==='ok'?'● Synchro':s==='err'?'● Hors ligne':s==='wait'?'● Connexion…':'● Local';e.className='sync '+s}
function snapState(){const o={};SK.forEach(k=>{const v=lget(k,undefined);if(v!==undefined)o[k]=v});o._t=Math.max(stamp,seen+1);return o}
function schedulePush(){if(!remote)return;pending=true;clearTimeout(pushT);pushT=setTimeout(push,600)}
async function push(){if(!remote)return;if(writing){dirty=true;return}writing=true;pending=false;
 try{const s=snapState();pushed.add(s._t);await remote.set(s);setSync('ok')}catch(e){setSync('err')}
 writing=false;if(dirty){dirty=false;push()}}
function mergeById(a,b,key){const m=new Map();(a||[]).forEach(x=>m.set(key(x),x));(b||[]).forEach(x=>{if(!m.has(key(x)))m.set(key(x),x)});return [...m.values()]}
function mergeInc(r,l){const m=new Map();(r||[]).forEach(x=>m.set(x.id,x));(l||[]).forEach(x=>{const y=m.get(x.id);if(!y||(x.u||0)>=(y.u||0))m.set(x.id,x)});return [...m.values()]}
function mergeLog(r,l){return mergeById(r,l,x=>x.d+'|'+x.t).sort((a,b)=>a.d<b.d?-1:1)}
function syncInit(){
 if(!window.claude||!window.claude.use){setSync('local');return}
 setSync('wait');
 (async()=>{try{
  const db=await window.claude.use('db');const user=await window.claude.use('user');
  if(!db||!user){setSync('local');return}
  const uid=await user.id();if(!uid){setSync('local');return}
  const ref=db.doc('data/users/'+uid+'/app');let first=true;
  const tm=setTimeout(()=>{if(first)setSync('err')},10000);
  ref.onSnapshot(snap=>{
   if(snap.metadata&&snap.metadata.hasPendingWrites)return;
   clearTimeout(tm);remote=ref;
   if(!snap.exists){if(first){first=false;push()}else setSync('ok');return}
   const d=snap.data()||{};const t=d._t||0;
   if(pushed.has(t)){seen=Math.max(seen,t);setSync('ok');first=false;return}   // écho de nos propres envois
   if(!first&&t<=stamp){setSync('ok');return}                                 // état distant plus ancien que nos modifs locales : ignoré
   seen=Math.max(seen,t);
   if(first||pending||writing){
     const L=mergeLog(d.log,lget('log',[]));const I=mergeInc(d.inc,lget('inc',[]));
     SK.forEach(k=>{if(k in d&&k!=='log'&&k!=='inc'&&!(k==='pce'&&!first&&(pending||writing)))lset(k,d[k])});lset('log',L);lset('inc',I);
     first=false;stamp=Math.max(Date.now(),seen+1);push()}
   else SK.forEach(k=>{if(k in d)lset(k,d[k])});
   favs.clear();(lget('favs',[])||[]).forEach(p=>favs.add(p));
   setSync('ok');refresh();
  },e=>setSync('err'));
 }catch(e){setSync('local')}})();
}
function refresh(){const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return;if(document.querySelector('.confirm'))return;if(cur==='search')return;if(R[cur])R[cur](curArg)}
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[’ʼ']/g,"'");
const PN=['','Le réseau','Prendre son poste','La fiche incident','Les messages TCL','Le rôle du superviseur','PC Événementiel / PC Crise','Procédures réflexes','Répertoire'];
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),1600)}
function copy(txt){const done=()=>toast('Copié');
 function fb(){const a=document.createElement('textarea');a.value=txt;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy');done()}catch(e){toast('Copie impossible')}a.remove()}
 try{if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(done,fb)}else fb()}catch(e){fb()}}
window._copy=copy;
function fmtTel(n){const f=n.startsWith('FAX');const d=f?n.slice(3):n;let s=d.length===10?d.replace(/(\d\d)(?=\d)/g,'$1 '):d;return {fax:f,d,s}}
function telHtml(n){const t=fmtTel(n);return t.fax?`<span class="tel fax">Fax ${t.s}</span>`:`<a class="tel" href="tel:${t.d}" onclick="event.stopPropagation()">☎ ${t.s}</a>`}
const pad=n=>String(n).padStart(2,'0');
const hhmm=d=>pad(d.getHours())+':'+pad(d.getMinutes());
const since=iso=>{const m=Math.max(0,Math.round((Date.now()-new Date(iso))/60000));return m<60?m+' min':Math.floor(m/60)+' h '+pad(m%60)};
// theme
let dark=store.get('dark',false);
function applyTheme(){document.body.classList.toggle('dark',!!dark);$('#theme').textContent=dark?'☀ Clair':'☾ Foncé';const m=document.querySelector('meta[name=theme-color]');if(m)m.content=dark?'#0c0b24':'#1d1677'}applyTheme();
$('#theme').onclick=()=>{dark=!dark;store.set('dark',dark);applyTheme()};
// nav

 else if((m=t.match(/(?:ligne|bus|le|du|la)\s*((?:tb|br|brf|c|j|jd|pl|zi|gm|s)\s?\d{1,3}e?|\d{1,3}e?)\b/i))&&(!/^\d{1,2}$/.test(m[1])||/chauffeur|conducteur|machiniste|\bbus\b/i.test(t))||((m=t.match(/(?:ligne|bus)\s*(\d{1,3}e?)\b/i)))){f.mode='bus';f.ligne=m[1].toUpperCase().replace(/\s/g,'')}

 if((m=t.match(/il y a\s+(\d{1,3}|une?|deux|trois|quatre|cinq|dix)\s*(min|minutes?|h|heures?)\b/i))){const q=isNaN(+m[1])?NUMW[m[1].toLowerCase()]||1:+m[1];const d=new Date(now.getTime()-q*(/^h/i.test(m[2])?3600000:60000));f.heure=pad(d.getHours())+':'+pad(d.getMinutes());if(d.toDateString()!==now.toDateString())f.dayBack=true}
 else if((m=t.match(/\b([01]?\d|2[0-3])\s?(?:h|:)\s?([0-5]\d)?\b/))){f.heure=pad(+m[1])+':'+(m[2]||'00');const [hh,mm]=f.heure.split(':').map(Number);if(hh*60+mm>now.getHours()*60+now.getMinutes()+30)f.dayBack=true}

async function aiAnalyse(text){if(!SAMPLE)return null;

1. id = numéro du fait de la LISTE DES FAITS qui correspond le mieux ; alt = jusqu'à 2 autres numéros plausibles.
2. cible = "A" si la victime est un agent du réseau (conducteur, chauffeur, CR, AL, contrôleur, agent SIA/DCI/ADS…), "V" si c'est un voyageur ou un tiers, null si inconnu. L'auteur n'est pas la cible.
3. mode parmi bus, tram, metro, funi, navi, ut, autre. ligne = identifiant exact de la liste RÉSEAU. arret = nom EXACT d'un arrêt de cette ligne dans la liste ; pour le bus, le nom tel qu'il est dit. prec = précision de lieu (quai, direction, à bord du véhicule…).

${netTxt()}

// ================= SYNCHRONISATION (GitHub privé, chiffré de bout en bout)
const GH={file:'superviseur-sync.json'};
const SYNCK=['inc','log','pce','ck','favs','vac','tclLvl','name'];
const ghCfg=()=>{try{return JSON.parse(localStorage.getItem('sv.sync')||'null')}catch(e){return null}};
let syncBusy=false,syncTimer=null,syncState='off',syncLast=lget('syncLast',null);
function syncUi(){const b=$('#syncbtn');if(!b)return;const c=ghCfg();
 b.className='iconbtn syncb '+(syncBusy?'busy':!c?'off':syncState);
 b.innerHTML=`<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.6-4.5L4 8M4 4v4h4M4 13a8 8 0 0 0 14.6 4.5L20 16M20 20v-4h-4"/></svg><span>${syncBusy?'Synchro…':!c?'Synchro':syncState==='err'?'Échec':'Synchro'}</span>`;
 b.title=!c?'Configurer la synchronisation':syncLast?'Dernière synchro : '+new Date(syncLast).toLocaleString('fr-FR'):'Synchroniser'}
const keyOf={inc:x=>x.id,log:x=>x.d+'|'+x.t};
function merge3(base,loc,rem){const out={};
 for(const k of SYNCK){const b=base[k],l=loc[k],r=rem[k];
  if(k==='inc'||k==='log'){const kf=keyOf[k];const M=a=>new Map((a||[]).map(x=>[kf(x),x]));const B=M(b),L=M(l),Rm=M(r);const res=new Map();
   for(const [id,x] of L){if(Rm.has(id)){const y=Rm.get(id);res.set(id,k==='inc'&&(y.u||0)>(x.u||0)?y:x)}else if(!B.has(id))res.set(id,x)}
   for(const [id,y] of Rm){if(!L.has(id)&&!B.has(id))res.set(id,y)}
   let arr=[...res.values()];if(k==='log')arr.sort((a,c)=>a.d<c.d?-1:a.d>c.d?1:0);if(arr.length||l!==undefined||r!==undefined)out[k]=arr}
  else{const sb=JSON.stringify(b),sl=JSON.stringify(l),sr=JSON.stringify(r);const v=sl===sb?r:(sr===sb?l:l);if(v!==undefined)out[k]=v}}
 return out}
async function ghReq(c,method,body){const r=await fetch(`https://api.github.com/repos/${c.repo}/contents/${GH.file}`,{method,cache:'no-store',
  headers:{'Authorization':'Bearer '+c.token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},body:body?JSON.stringify(body):undefined});
 return r}
const u8b64=b=>{let s='';const a=new Uint8Array(b);for(let i=0;i<a.length;i+=8192)s+=String.fromCharCode.apply(null,a.subarray(i,i+8192));return btoa(s)};
const b64u8=s=>Uint8Array.from(atob(s.replace(/\s/g,'')),c=>c.charCodeAt(0));
async function syncNow(manual){const c=ghCfg();if(!c){if(manual)go('settings');return}
 if(syncBusy)return;if(!navigator.onLine){syncState='err';syncUi();if(manual)toast('Pas de réseau : synchro plus tard');return}
 syncBusy=true;syncUi();if(window._flushFiche){window._flushFiche()}
 try{for(let attempt=0;attempt<3;attempt++){
   let rem={},sha=null;const g=await ghReq(c,'GET');
   let fresh=false;
   if(g.status===200){const j=await g.json();sha=j.sha;let cnt=j.content;
    if(!cnt||j.encoding==='none'){const bl=await fetch(`https://api.github.com/repos/${c.repo}/git/blobs/${j.sha}`,{cache:'no-store',headers:{'Authorization':'Bearer '+c.token,'Accept':'application/vnd.github+json'}});if(!bl.ok)throw new Error('GitHub '+bl.status);cnt=(await bl.json()).content}
    const box=JSON.parse(new TextDecoder().decode(b64u8(cnt)));
    try{rem=JSON.parse(new TextDecoder().decode(await window.__svDec(b64u8(box.ct),b64u8(box.iv),'sync')))}catch(e){rem={};fresh=true;toast('Fichier de synchro d\'une ancienne clé : il va être remplacé')}}
   else if(g.status===404){fresh=true}
   else throw new Error(g.status===401?'jeton refusé':g.status===403?'accès refusé':'GitHub '+g.status);
   const loc={};SYNCK.forEach(k=>{const v=lget(k,undefined);if(v!==undefined)loc[k]=v});
   const base=fresh?{}:JSON.parse(localStorage.getItem('sv.base')||'{}');
   const m=merge3(base,loc,rem);
   const same=JSON.stringify(m)===JSON.stringify(rem);
   if(!same||!sha){const {iv,ct}=await window.__svEnc(new TextEncoder().encode(JSON.stringify(m)),'sync');
    const content=btoa(JSON.stringify({v:1,t:new Date().toISOString(),iv:u8b64(iv),ct:u8b64(ct)}));
    const p=await ghReq(c,'PUT',Object.assign({message:'synchro '+new Date().toISOString(),content},sha?{sha}:{}));
    if(p.status===409||p.status===422){continue}
    if(!(p.status===200||p.status===201))throw new Error(p.status===401?'jeton refusé':p.status===403||p.status===404?'droits insuffisants sur le dépôt':'GitHub '+p.status)}
   const now={};SYNCK.forEach(k=>{const v=lget(k,undefined);if(v!==undefined)now[k]=v});
   const fin=JSON.stringify(now)===JSON.stringify(loc)?m:merge3(loc,now,m);
   SYNCK.forEach(k=>{if(k in fin)lset(k,fin[k])});favs.clear();(lget('favs',[])||[]).forEach(p=>favs.add(p));
   try{localStorage.setItem('sv.base',JSON.stringify(m))}catch(e){}syncLast=Date.now();if(fin!==m)window.__svChanged();lset('syncLast',syncLast);syncState='ok';
   if(manual)toast('Synchronisé');refresh();return}
  throw new Error('conflit répété')}
 catch(e){syncState='err';if(manual)toast('Synchro impossible : '+(e.message||e))}
 finally{syncBusy=false;syncUi()}}
window.__svChanged=()=>{if(!ghCfg())return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>syncNow(false),8000)};

// ================= CONTACTS
const ANN=D.ann.map(a=>({...a,s_:norm(a.c+' '+a.s+' '+a.l+' '+a.n.join(' ')+' '+a.n.map(n=>fmtTel(n).s).join(' '))}));
const IND=S.indicatifs.map(r=>({c:'Indicatifs radio',s:r[0],l:[r[1],r[2]].filter(Boolean).join(' · '),n:[],ind:r[3],s_:norm(r.join(' '))}));
function annRow(a){const nums=a.n.filter(n=>!n.startsWith('FAX')).map(n=>fmtTel(n).s).join(' / ');
 return `<div class="row" style="cursor:default;align-items:flex-start"><div class="t"><b>${esc(a.l||a.s||'Standard')}</b><small>${esc(cname(a.c))}${a.s&&!/Ligne 98 :/.test(a.s)?' · '+esc(a.s):''}</small>
 ${a.ind?`<span class="ind">${esc(a.ind)}</span>`:''}${a.n.length?'<div style="margin-top:4px">'+a.n.map(telHtml).join('')+'</div>':''}</div>
 ${nums?`<button class="btn ghost sm" data-c="${esc(nums)}">Copier</button>`:''}</div>`}
function bindCopy(root){(root||view).querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>copy(b.dataset.c))}
const ASIDE={
 int:{t:'Annuaire interne',d:'Réseau TCL, RATP Dev, PC, sûreté, codes ETARE',g:[
  ['Sûreté & PCS',['Indicatifs radio','PCS Opérateurs','Rubis (sécurité privée)','Direction Sûreté RATP','Codir RATP - SYTRAL','SIA - ML','DCI KBL','Service Vidéo','MSPRATP','CODAGEMSPRATP']],
  ['PC d\'exploitation',['PC Bus','PC Métro','PC Tram','PC Crise','RX','Navigône','Subdélégués','Réquisition Bus']],
  ['Unités de transport (UT)',['UTA - UTSP - UTC','UTN - UTPE','UTP - UTO - Givors','UTS - UTV']],
  ['Événementiel',['Stade OL']],
  ['Codes ETARE',['Etare Métro A','Etare Métro B','Etare Métro C','Etare Métro D + Funi','Etare PR - Agences - Dépôts','Etare Divers']],
  ['Adresses des arrêts tram',['T1','T2 - T5','T3 + T7 + IB','T4','T6']],
  ['Divers',['Divers PCS']]]},
 ext:{t:'Annuaire externe',d:'Forces de l\'ordre, secours, partenaires',g:[
  ['Forces de l\'ordre',['Police','Gendarmerie','PM']],
  ['Secours & santé',['Hôpitaux - Urgences diverses']],
  ['Partenaires',['Sûreté SNCF','CSU - Etablissement Sensibles','LPA']],
  ['Juridique & soutien',['Avocats KBL','Avocat - Num Psy']]]}};
const CNAME={'PM':'Police municipale','Police':'Police nationale','MSPRATP':'MSP RATP','CODAGEMSPRATP':'Codage MSP RATP','T1':'Tram T1','T2 - T5':'Tram T2 · T5','T3 + T7 + IB':'Tram T3 · T7','T4':'Tram T4','T6':'Tram T6','UTA - UTSP - UTC':'UTA · UTSP · UTC','UTN - UTPE':'UTN · UTPE','UTP - UTO - Givors':'UTP · UTO · Givors','UTS - UTV':'UTS · UTV','Etare PR - Agences - Dépôts':'Etare PR · agences · dépôts','Etare Métro D + Funi':'Etare Métro D + funi','Hôpitaux - Urgences diverses':'Hôpitaux · urgences diverses','CSU - Etablissement Sensibles':'CSU · établissements sensibles','LPA':'LPA (parcs autos)','SIA - ML':'SIA · Mode lourd'};
const cname=c=>CNAME[c]||c;
(function(){const known=new Set([].concat(...Object.values(ASIDE).map(x=>[].concat(...x.g.map(g=>g[1])))));const rest=[...new Set(D.ann.map(a=>a.c))].filter(c=>!known.has(c));if(rest.length)ASIDE.int.g[ASIDE.int.g.length-1][1].push(...rest)})();
const catRows=c=>c==='Indicatifs radio'?IND:ANN.filter(a=>a.c===c);
const sideCats=k=>[].concat(...ASIDE[k].g.map(g=>g[1]));
R.ann=function(arg){
 const pre=typeof arg==='string'?arg:'';arg=typeof arg==='object'&&arg?arg:{};
 const side=arg.side,cat=arg.cat;
 const back='';
 let body='';
 if(!side){
 body=`<h1>Annuaire</h1><input class="f" id="aq" placeholder="Chercher partout : nom, service, commune, numéro, ETARE…" value="${esc(pre)}" style="margin-top:10px">
  <div id="ares"></div><div id="aside" class="bgrid two" style="margin-top:12px">${['int','ext'].map(k=>{const n=sideCats(k).reduce((t,c)=>t+catRows(c).length,0);return `<button class="bb fam2" style="--c:${k==='int'?'var(--acc)':'var(--navy)'}" data-side="${k}">${svgI(k==='int'?'<path d="M3 10 12 3l9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/>':'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>')}<b>${k==='int'?'Interne':'Externe'}</b><span>${esc(ASIDE[k].d)} · ${n} contacts</span></button>`}).join('')}</div>
  <h2>Répertoire du classeur</h2><div class="list">${[92,93,94,95,96,97,98].map(p=>pageRow(PAGES[p-1])).join('')}</div>`;
 }else if(!cat){
  body=`<h1>${esc(ASIDE[side].t)}</h1><input class="f" id="aq" placeholder="Chercher dans l'annuaire ${side==='int'?'interne':'externe'}…" style="margin-top:10px"><div id="ares"></div>
  <div id="aside">${ASIDE[side].g.map(([g,cs],gi)=>`<h2>${esc(g)}</h2><div class="bgrid">${cs.filter(c=>catRows(c).length).map(c=>`<button class="bb" style="--c:${side==='int'?'var(--acc)':'var(--navy)'};min-height:84px" data-cat="${esc(c)}"><span class="cnt">${catRows(c).length}</span><b style="padding-right:30px">${esc(cname(c))}</b></button>`).join('')}</div>`).join('')}</div>`;
 }else{
  const rows=catRows(cat);const groups={};rows.forEach(r=>{const g=(r.s||'').replace(/Ligne 98 :.*$/,'').trim()||'—';(groups[g]=groups[g]||[]).push(r)});
  body=`<h1>${esc(cname(cat))}</h1><input class="f" id="aq" placeholder="Filtrer…" style="margin-top:10px"><div id="ares"></div>
  <div id="aside">${Object.entries(groups).map(([g,rs])=>`${Object.keys(groups).length>1&&g!=='—'?`<h2>${esc(g)}</h2>`:'<div style="height:10px"></div>'}<div class="list">${rs.map(annRow).join('')}</div>`).join('')}</div>`;
 }
 view.innerHTML=back+body;bindCopy();
 view.querySelectorAll('[data-side]').forEach(b=>b.onclick=()=>go('ann',{side:b.dataset.side}));
 view.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>go('ann',{side,cat:b.dataset.cat}));
 const src=cat?catRows(cat):side?[].concat(...sideCats(side).map(catRows)):[...IND,...ANN];
 const aq=$('#aq');const draw=()=>{const q=norm(aq.value).split(/\s+/).filter(Boolean);const out=$('#ares'),sd=$('#aside');
  if(!q.length){out.innerHTML='';sd.style.display='';return}
  const res=src.filter(a=>q.every(w=>a.s_.includes(w)));sd.style.display='none';
  out.innerHTML=`<div class="sub" style="margin:8px 2px">${res.length} résultat${res.length>1?'s':''}${res.length>150?' · affine pour voir la suite':''}</div><div class="list">${res.length?res.slice(0,150).map(annRow).join(''):'<div class="empty">Aucun résultat.</div>'}</div>`;bindCopy(out)};
 aq.oninput=draw;if(pre)draw();
};
R.radio=function(){
 const vac=store.get('vac','2');
 view.innerHTML=seg('fiches','radio')+`<div class="cols"><div>
 <h2 style="margin-top:4px">Pétales SIA · Onyx (fiche 1.9)</h2>
 <div class="list"><table class="tb"><tr><th>Pétale</th><th>Matin</th><th>Après-midi</th><th>Soir</th></tr>${S.petales.map(([n,nm,c])=>`<tr><td><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${c};margin-right:6px"></span>${n} · ${esc(nm)}</td>${['2','3','4'].map(v=>`<td class="m" style="${v===vac?'':'color:var(--mute);font-weight:400'}">${v}${n}</td>`).join('')}</tr>`).join('')}</table></div>
 <div class="sub" style="margin-top:6px">Dizaine = vacation (2 matin · 3 après-midi · 4 soir). Unité = n° du pétale.</div>
 <h2>Listing des SSI</h2><div class="list"><table class="tb"><tr><th>Indicatif</th><th>SSI</th></tr>${S.ssi.map(r=>`<tr><td><b>${r[0]}</b></td><td class="m">${r[1]}</td></tr>`).join('')}</table></div>
 </div><div>
 <h2 style="margin-top:4px">Codage radio TETRA (fiche 8.1)</h2>
 <div class="list">${S.tetra.map((t,i)=>`<div class="row" style="cursor:default"><span class="num">${i+1}</span><div class="t">${esc(t)}</div></div>`).join('')}</div>
 <div class="list" style="margin-top:10px">${[15,92,93].map(p=>pageRow(PAGES[p-1])).join('')}</div>
 </div></div>`;
};
// ================= VACATION
let logMax=150;
R.log=function(){
 const l=store.get('log',[]);
 view.innerHTML=seg('log','log')+`<div class="card"><textarea class="f" id="lt" placeholder="Ce qui se passe… (Entrée = ajouter, Maj+Entrée = retour à la ligne)"></textarea>
 <div style="display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap"><input class="f" id="lh" type="time" style="width:130px"><button class="btn" id="ladd">Ajouter</button>
 <span style="flex:1"></span><button class="btn ghost sm" id="lcp">Tout copier</button><button class="btn ghost sm" id="ldl" style="display:none">Exporter .txt</button><button class="btn ghost sm" id="lclr">Nouvelle vacation</button></div></div>
 <div class="sub" style="margin:8px 2px">Notes libres de la vacation. Utile aussi en mode dégradé (fiche 3.4).</div>
 <div class="list" id="ll">${l.length?l.slice().reverse().slice(0,logMax).map((x,ri)=>{const i=l.length-1-ri;return `<div class="log"><span class="h">${esc(x.h)}</span><span class="x">${esc(x.t)}</span><button data-i="${i}" title="Copier">⧉</button><button data-d="${i}" title="Supprimer">✕</button></div>`}).join(''):'<div class="empty">Aucune note pour cette vacation.</div>'}</div>${l.length>logMax?`<button class="btn ghost" style="width:100%;margin-top:8px" id="lmore">Afficher plus (${l.length-logMax} notes plus anciennes)</button>`:''}`;
 const lm=$('#lmore');if(lm)lm.onclick=()=>{logMax+=200;R.log()};
 $('#lh').value=hhmm(new Date());
 const add=()=>{const t=$('#lt').value.trim();if(!t)return;addLog(t,$('#lh').value||null);R.log();$('#lt').focus()};
 $('#ladd').onclick=add;$('#lt').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();add()}};
 const all=()=>store.get('log',[]).map(x=>x.h+'  '+x.t).join('\n');
 $('#lcp').onclick=()=>copy(all());
 {const b=$('#ldl');b.style.display='';b.onclick=()=>{const d=new Date();svDownload(`vacation_${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}_${pad(d.getHours())}h${pad(d.getMinutes())}.txt`,all(),'text/plain')}}
 $('#lclr').onclick=e=>{const b=e.currentTarget;if(b.dataset.c){store.set('log',[]);R.log();toast('Journal vidé · les incidents sont conservés')}else{b.dataset.c='1';b.textContent='Confirmer : tout effacer ?';b.classList.add('confirm');setTimeout(()=>{if(b.isConnected){delete b.dataset.c;b.textContent='Nouvelle vacation';b.classList.remove('confirm')}},4000)}};
 view.querySelectorAll('#ll [data-i]').forEach(b=>b.onclick=()=>{const x=store.get('log',[])[+b.dataset.i];copy(x.h+'  '+x.t)});
 view.querySelectorAll('#ll [data-d]').forEach(b=>b.onclick=()=>{const l=store.get('log',[]);l.splice(+b.dataset.d,1);store.set('log',l);R.log()});
};
R.check=function(){
 const day=vacKey();let st=store.get('ck',{});if(st._d!==day){st={_d:day}}
 view.innerHTML=seg('log','check')+`<div class="sub" style="margin-bottom:4px">Les cases se remettent à zéro à chaque vacation (04h · 12h · 20h). Aujourd'hui : journal ${todayInfo().join(' + ').toLowerCase()} entre 05:00 et 06:00.</div>
 <div class="cols">${[0,1].map(c=>`<div>${Object.entries(S.checklists).filter((_,i)=>i%2===c).map(([k,cl])=>{const n=cl.items.filter((_,i)=>st[k+i]).length;return `<h2>${esc(cl.t)} <span class="pill">${n}/${cl.items.length}</span></h2><div class="list">${cl.items.map((it,i)=>{const on=st[k+i];return `<label class="ck ${on?'done':''}"><input type="checkbox" data-k="${k+i}" ${on?'checked':''}><span>${esc(it)}</span></label>`}).join('')}
 <div class="row" onclick="_open(${cl.p})"><div class="t"><small>Ouvrir la fiche · p. ${cl.p}</small></div><span>›</span></div></div>
 <button class="btn ghost sm" style="margin-top:6px" data-r="${k}">Tout décocher</button>`}).join('')}</div>`).join('')}</div>`;
 view.querySelectorAll('.ck input').forEach(i=>i.onchange=()=>{st[i.dataset.k]=i.checked;st._d=day;store.set('ck',st);R.check()});
 view.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{Object.keys(st).forEach(x=>{if(x.startsWith(b.dataset.r))delete st[x]});store.set('ck',st);R.check()});
};
// ================= SEARCH
const PIDX=PAGES.filter(d=>!['notes','cover','sommaire','divider'].includes(d.kind)).map(d=>({d,t:norm(d.id+' '+d.title+' '+d.sub),x:norm(d.text)}));
function hl(s,q){let h=esc(s);q.forEach(w=>{if(w.length<2)return;const re=new RegExp('('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');h=h.replace(re,'<span class="hl">$1</span>')});return h}
function search(raw){
 const q=norm(raw).split(/\s+/).filter(Boolean);if(!q.length){if(cur==='search')goBack();return}
 if(cur!=='search'&&cur){navStack.push({t:cur,a:curArg})}cur='search';document.querySelectorAll('nav [data-t]').forEach(b=>b.classList.remove('on'));updBack();
 const pr=PIDX.map(o=>{let sc=0;for(const w of q){const a=o.t.includes(w),b=o.x.includes(w);if(!a&&!b)return null;sc+=(a?10:0)+(b?1:0)}return [sc,o.d]}).filter(Boolean).sort((a,b)=>b[0]-a[0]).slice(0,25);
 const ar=[...IND,...ANN].filter(a=>q.every(w=>a.s_.includes(w)));
 const gr=S.glossaire.filter(g=>q.every(w=>norm(g.join(' ')).includes(w)));
 const cr=S.codes.filter(c=>q.every(w=>norm(c.join(' ')).includes(w)));
 const sr=S.ssi.filter(c=>q.every(w=>norm(c.join(' ')+' ssi').includes(w)));
 const ir=ISIS.map((r,i)=>[r,i]).filter(([r])=>q.every(w=>norm(r.f1+' '+r.f2+' '+r.f3+' '+r.n).includes(w))).slice(0,12);
 const words=raw.trim().split(/\s+/);
 view.innerHTML=`<h1>Résultats</h1><div class="sub">« ${esc(raw)} »</div>
 ${ir.length?`<h2>Faits ISIS · gérer l'incident</h2><div class="list">${ir.map(([r,i])=>natRow(r,i,true)).join('')}</div>`:''}
 ${gr.length?`<h2>Glossaire</h2><div class="list">${gr.map(([s,d])=>`<div class="row" style="cursor:default"><span class="num" style="min-width:110px">${esc(s)}</span><div class="t">${esc(d)}</div></div>`).join('')}</div>`:''}
 ${cr.length||sr.length?`<h2>Codes</h2><div class="list">${cr.map(c=>`<div class="row" onclick="_go('codes')"><span class="num">${c[1]}</span><div class="t"><b>Code MC ${c[2]}</b><small>${esc(c[0])} · ${esc(c[3])}</small></div></div>`).join('')}${sr.map(c=>`<div class="row" onclick="_go('radio')"><span class="num">SSI</span><div class="t"><b>${c[0]} · ${c[1]}</b></div></div>`).join('')}</div>`:''}
 <div class="cols"><div><h2>Fiches · ${pr.length}</h2><div class="list">${pr.length?pr.map(([s,d])=>{let ex='';if(!q.every(w=>norm(d.id+' '+d.title).includes(w))){const i=norm(d.text).indexOf(q[0]);if(i>=0)ex='…'+d.text.slice(Math.max(0,i-40),i+80)+'…'}
   const oc=d.kind==='logi'?`_go('reflx','${d.id}')`:d.kind==='mc'&&d.of?`_go('reflx','${d.of}')`:`_open(${d.p})`;
   return `<div class="row" onclick="${oc}"><span class="num">${esc(d.id)}</span><div class="t"><b>${hl(d.title,words)}</b><small>${ex?hl(ex,words):esc(d.sub)} · p. ${d.p}</small></div><span>›</span></div>`}).join(''):'<div class="empty">Aucune fiche.</div>'}</div></div>
 <div><h2>Contacts · ${ar.length}</h2><div class="list">${ar.length?ar.slice(0,30).map(annRow).join(''):'<div class="empty">Aucun contact.</div>'}</div>
 ${ar.length>30?`<button class="btn ghost" style="margin-top:8px;width:100%" id="annall">Voir les ${ar.length} contacts</button>`:''}</div></div>`;
 view.querySelectorAll('[data-ri]').forEach(b=>b.onclick=()=>window._pick(+b.dataset.ri));
 bindCopy();const aa=$('#annall');if(aa)aa.onclick=()=>{store.set('annCat','Tout');go('ann',raw)};
}
let stq=null;$('#q').addEventListener('input',e=>{clearTimeout(stq);const v=e.target.value;stq=setTimeout(()=>search(v),120)});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();$('#q').focus()}});
(()=>{const l=lget('log',[]);const lim=new Date(Date.now()-90*864e5).toISOString();const k=l.filter(x=>!x.d||x.d>=lim);if(k.length<l.length)lset('log',k)})();
go('home');
$('#syncbtn').onclick=()=>syncNow(true);syncUi();if(ghCfg())setTimeout(()=>syncNow(false),1200);
}
